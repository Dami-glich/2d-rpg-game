<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban Outlaw RPG</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="hud">
      <div class="topbar">
        <div>
          <h1>Urban Outlaw RPG</h1>
        </div>
        <div class="stats">
          <div><span>Health</span><strong id="health">100</strong></div>
          <div><span>Cash</span><strong id="cash">$150</strong></div>
          <div><span>Rep</span><strong id="rep">0</strong></div>
          <div><span>Medkits</span><strong id="medkits">1</strong></div>
        </div>
      </div>
      <div id="objective">Objective: Explore the city and complete the first district missions.</div>
      <div id="message">Move with WASD or Arrow Keys. Press I for inventory and shop.</div>
    </div>

    <aside id="inventoryPanel" class="hidden" aria-live="polite">
      <div class="panel-header">
        <h2>Inventory & Shop</h2>
        <button id="closeInventory" type="button">X</button>
      </div>

      <div class="panel-section">
        <h3>Inventory</h3>
        <ul id="inventoryList"></ul>
      </div>

      <div class="panel-section">
        <h3>Shop</h3>
        <div id="shopList"></div>
      </div>
    </aside>

    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <script src="script.js"></script>
  </body>
</html>
